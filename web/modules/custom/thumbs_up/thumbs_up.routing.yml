thumbs_up.up:
  path: '/thumbs-up/{uuid}/up'
  methods:  [GET, POST]
  defaults:
    _title: 'Thumbs Up'
    _controller: '\Drupal\thumbs_up\Controller\ThumbsUpController::up'
  requirements:
    _permission: 'access content'

thumbs_up.subscribe:
  path: '/thumbs-up/{uuid}/subscribe'
  methods:  [GET, POST]
  defaults:
    _title: 'Thumbs Up Subscribe'
    _controller: '\Drupal\thumbs_up\Controller\ThumbsUpController::subscribe'
  requirements:
    _permission: 'access content'

entity.thumbs_up_event.settings:
  path: 'admin/structure/thumbs-up-event'
  defaults:
    _form: '\Drupal\thumbs_up\Form\ThumbsUpEventSettingsForm'
    _title: 'thumbs_up_event'
  requirements:
    _permission: 'administer thumbs_up_event'
