# Page-level styles shared by this module's components: the learning-path card
# body and the run-button animation, plus the run button's click script.
# Buttons are the Design System API's (ds-button), so that library is a
# dependency here and the page does not rely on the theme opting in.
# Components depend on this so they render the same anywhere.
start:
  css:
    theme:
      css/start.css: {}
  js:
    js/run-button.js: {}
  dependencies:
    - core/drupal
    - core/once
    - design_system_api/forms
