$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Path step
status: stable
description: 'One numbered step of the learning path: a rail marker, the workflow, what it needs, and Try it / Open editor.'
group: FlowDrop Demo
props:
  type: object
  required:
    - number
    - title
  properties:
    number:
      type: string
    title:
      type: string
    stage:
      type: string
      description: 'Shown above the step: set it on the first step of each stage only.'
    description:
      type: string
    try_text:
      type: string
      description: 'What to type or do in Test mode. Trusted markup (from t()), rendered raw.'
    see_text:
      type: string
      description: 'What comes back. Trusted markup (from t()), rendered raw.'
    needs:
      type: array
      description: "Requirement pills: {label, variant} with an fd_demo:pill variant."
      items:
        type: object
        properties:
          label: { type: string }
          variant: { type: string }
    node_count:
      type: integer
    try_url:
      type: string
    edit_url:
      type: string
    hints_label:
      type: string
      description: 'Summary of the folded try/see hints.'
    try_label:
      type: string
    edit_label:
      type: string
libraryOverrides:
  dependencies:
    - fd_demo/start
