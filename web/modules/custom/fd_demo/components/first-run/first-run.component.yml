$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: First run
status: stable
description: 'A short guided walkthrough: numbered steps, each with what to do and the one button that does it.'
group: FlowDrop Demo
props:
  type: object
  required:
    - steps
  properties:
    steps:
      type: array
      items:
        type: object
        properties:
          title: { type: string }
          text:
            type: string
            description: 'Trusted markup (from t()), rendered raw.'
          action_label: { type: string }
          action_url: { type: string }
          action_kind:
            type: string
            enum: [try, edit]
    outro:
      type: string
libraryOverrides:
  dependencies:
    - fd_demo/start
