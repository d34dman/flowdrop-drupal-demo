  -
    id: note.1
    type: universalNode
    position:
      x: -1760
      'y': -460
    data:
      label: Note
      config:
        content: |-
          ## FlowDrop Chat Processor

          This workflow implements a conversational AI assistant with persistent memory.

          **Flow:**
          1. **Message** — User's input text
          2. **Workflow State** — Current workflow JSON passed in for context
          3. **Conversation Key** — Session/user key used to scope conversation history
          4. **Get Node Types** — Fetches available node type definitions
          5. **Build System Prompt** — Combines workflow state + node types into a dynamic system prompt
          6. **Read History** — Loads previous conversation messages from memory (global scope)
          7. **Chat** — Sends message, system prompt, and history to the AI model
          8. **Save User Message** — Persists the user's message to the conversation buffer
          9. **Save Assistant Response** — Persists the AI's response to the conversation buffer
          10. **Response** — Outputs the final AI response

          **Key behaviours:**
          - Conversation history is stored globally, keyed by the Conversation Key input
          - The AI is context-aware of the current workflow state and available node types
          - The user message is saved before the AI responds; the assistant response is saved after
        noteType: info
      metadata:
        id: note
        name: Note
        type: note
        supportedTypes:
          - note
        description: 'Add notes and comments'
        category: helpers
        icon: 'mdi:note-text-outline'
        plugin_version: 1.0.0
        enabled: true
        tags: {  }
        executor_plugin: 'flowdrop_node_processor:note'
        inputs:
          -
            id: trigger
            name: Trigger
            type: input
            dataType: trigger
            required: false
            description: ''
        outputs:
          -
            id: trigger
            name: Trigger
            type: output
            dataType: trigger
            required: false
            description: 'Emitted when this node completes execution'
        config:
          content: "# Workflow Notes\r\n\r\nAdd your documentation here using **Markdown** formatting.\r\n\r\n## Features\r\n- Supports **bold** and *italic* text\r\n- Create lists and code blocks\r\n- Add links and more!"
          noteType: info
        configSchema:
          type: object
          properties:
            content:
              type: string
              title: 'Note Content'
              description: 'Documentation or comment text (supports Markdown)'
              format: markdown
              default: |-
                # Workflow Notes

                Add your documentation here using **Markdown** formatting.

                ## Features
                - Supports **bold** and *italic* text
                - Create lists and code blocks
                - Add links and more!
            noteType:
              type: string
              title: 'Note Type'
              description: 'Visual style and color of the note'
              default: info
              enum:
                - info
                - warning
                - success
                - error
                - note
            instanceTitle:
              type: string
              title: Title
              description: 'Override the default node title for this instance.'
              x-display-order: -2
            instanceDescription:
              type: string
              title: Description
              description: 'Override the default description for this instance.'
              format: multiline
              x-display-order: -1
          required: {  }
      nodeId: note.1
    deletable: true
    measured:
      width: 500
      height: 882
    selected: true
    dragging: false
