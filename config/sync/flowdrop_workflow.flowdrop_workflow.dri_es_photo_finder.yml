  -
    id: prompt_template.2
    position:
      x: 2560
      'y': 600
    data:
      label: 'Render gallery'
      config:
        template: |-
          {%- set limit = filters.limit ?: 6 -%}
          {%- set sorted = filters.sort == 'oldest' ? images|sort((a, b) => a.date <=> b.date) : images|sort((a, b) => b.date <=> a.date) -%}
          {%- set shown = sorted|slice(0, limit) -%}
          {%- if total == 0 -%}
          No photos match those filters.
          {%- else -%}
          **{{ total }} photo{{ total == 1 ? '' : 's' }} match** · showing {{ shown|length }}, {{ filters.sort == 'oldest' ? 'oldest' : 'newest' }} first
          <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:8px">
          {%- for img in shown %}
          <a href="{{ img.url }}" target="_blank" style="text-decoration:none;color:inherit"><img src="{{ img.thumbnail }}" alt="{{ img.alt ?: img.title }}" style="display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px"><div style="font-size:13px;font-weight:600;margin-top:4px;line-height:1.3">{{ img.title }}</div><div style="font-size:12px;opacity:.65">{{ img.date|date('j M Y') }}</div></a>
          {%- endfor %}
          </div>
          {%- endif -%}
        dynamicInputs:
          -
            name: total
            label: total
            description: ''
            dataType: integer
            required: false
          -
            name: images
            label: images
            description: ''
            dataType: array
            required: false
          -
            name: filters
            label: filters
            description: ''
            dataType: json
            required: false
        instanceTitle: 'Render gallery'
        nodeType: default
        maxRetries: 0
        ports:
          inputs:
            -
              id: variables
            -
              id: template
            -
              id: images
            -
              id: total
            -
              id: filters
            -
              id: loop_back
            -
              id: trigger
              exposed: false
          outputs:
            -
              id: prompt
            -
              id: template
            -
              id: variables
            -
              id: trigger
              exposed: false
            -
              id: tool
            -
              id: error
        requiresConfirmation: ''
      metadata:
        node_type_id: prompt_template
