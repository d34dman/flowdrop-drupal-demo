  -
    id: prompt_template.1
    position:
      x: 380
      'y': 220
    data:
      label: 'Build filter form'
      config:
        template: |-
          {%- set albums_opts = [{'const': '', 'title': 'All albums'}] -%}
          {%- for a in albums -%}
            {%- set albums_opts = albums_opts|merge([{'const': a.id, 'title': a.title ~ (a.year ? ' (' ~ a.year ~ ')' : '')}]) -%}
          {%- endfor -%}
          {{ {
            'type': 'object',
            'properties': {
              'query': {'type': 'string', 'title': 'Words', 'description': 'Words in the title, caption or alt text. Leave empty to browse.'},
              'album': {'type': 'string', 'title': 'Album', 'oneOf': albums_opts, 'default': ''},
              'sort': {'type': 'string', 'title': 'Order', 'oneOf': [{'const': 'newest', 'title': 'Newest first'}, {'const': 'oldest', 'title': 'Oldest first'}], 'default': 'newest'},
              'limit': {'type': 'integer', 'title': 'How many', 'minimum': 1, 'maximum': 20, 'default': 6}
            }
          }|json_encode|raw }}
        dynamicInputs:
          -
            name: albums
            label: albums
            description: ''
            dataType: array
            required: false
        instanceTitle: 'Build filter form'
        nodeType: default
        maxRetries: 0
        ports:
          inputs:
            -
              id: variables
              exposed: false
            -
              id: template
            -
              id: albums
            -
              id: loop_back
            -
              id: trigger
              exposed: false
