        maxRetries: 0
        requiresConfirmation: waive
        instanceTitle: 'Find dri.es photos'
        instanceDescription: 'Find photos on dri.es by words in their title, caption or alt text, and/or by album id (from find_albums). Returns total and up to 20 images with title, url, thumbnail, alt, caption and date.'
        ports:
          outputs:
            -
