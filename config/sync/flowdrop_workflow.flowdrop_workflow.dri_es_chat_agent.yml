    data:
      label: 'Find dri.es photo albums'
      config:
        nodeType: tool
        maxRetries: 0
        requiresConfirmation: waive
        instanceTitle: 'Find dri.es photo albums'
        instanceDescription: 'Find photo albums on dri.es by words in their name, including the year (e.g. "2019"). Omit query to list all albums. Returns albums with id, title, url, year and description.'
        ports:
          outputs:
            -
              id: tool
