        maxRetries: 0
        requiresConfirmation: waive
        instanceTitle: 'Search dri.es'
        instanceDescription: 'Full-text search across dri.es blog posts and pages. Input q: search words (every term must match as a prefix). Returns total and up to 20 results with title, url, date, snippets and summary. Append .md to a result url for the full text.'
        ports:
          outputs:
            -
              id: tool
              exposed: true
