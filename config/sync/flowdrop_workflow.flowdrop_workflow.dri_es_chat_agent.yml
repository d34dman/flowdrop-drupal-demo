    position:
      x: -140
      'y': 700
    data:
      label: Toolbox
      config:
        nodeType: default
        maxRetries: 0
        requiresConfirmation: ''
        instanceTitle: 'dri.es tools'
      metadata:
        node_type_id: flowdrop_node_processor_toolbox
    measured:
      width: 280
      height: 262
  -
    id: flowdrop_workflow_react_agent.1
    position:
      x: 300
      'y': 440
    data:
      label: 'ReAct agent'
      config:
        nodeType: default
        executionMode: job
        system_prompt: |-
          You are a research assistant for Dries Buytaert's website, dri.es.
          Answer questions by using your tools, not from memory:
          - "Search dri.es" for blog posts and pages. Use a few specific words; if nothing relevant comes back, retry with different words.
          - "Find dri.es photo albums" and "Find dri.es photos" for photography.

          Rules:
          - Base your answer only on what the tools return in this conversation.
          - Write every post or photo you mention as a Markdown link, [Title](url), followed by its date.
          - When asked for recent items, sort by date, newest first.
          - If the tools return nothing relevant, say so plainly.
          - Keep answers short.
        maxRetries: 0
        requiresConfirmation: ''
        instanceTitle: 'dri.es research agent'
        ports:
          outputs:
            -
              id: reply
            -
              id: trigger
              exposed: false
            -
              id: error
      metadata:
        node_type_id: flowdrop_workflow_react_agent
    measured:
      width: 280
      height: 322
