            required: false
            description: 'The markdown content of the note'
          -
            id: noteType
            name: 'Note Type'
            type: output
            dataType: string
            required: false
            description: 'The visual type of the note (info, warning, success, error, note)'
          -
            id: message
            name: Message
            type: output
            dataType: string
            required: false
            description: 'Status message about the note'
