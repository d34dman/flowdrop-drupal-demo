  -
    id: notes.1
    type: universalNode
    position:
      x: -2170
      'y': 600
    data:
      label: Notes
      config:
        content: |-
          # Metatag Automation

          This workflow will be triggered after a page (content type) is created or updated.

          Then if the ```field_metatag``` is empty it will trigger the field extractor to get the body field (field_content) and pass the value to the chat model using ```llama3.2:latest``` model which will acts as a SEO expert, then it will return the generated meta title and meta description into a JSON parser, then it will finally generate/update the metatags
        noteType: info
      metadata:
        id: notes
        name: Notes
        type: note
        supportedTypes:
          - note
        description: 'Add documentation and comments to your workflow with Markdown support'
        category: tools
        icon: 'mdi:note-text'
