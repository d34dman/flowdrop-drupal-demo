uuid: db6428c9-6030-4007-a4e5-3e34173bfbdd
langcode: en
status: true
dependencies: {  }
id: dri_es
label: dri.es
description: 'Dries Buytaert blog MCP (stateless 2026-07-28)'
endpoint: 'https://dri.es/mcp'
transport_type: http
stdio_command: null
stdio_env: {  }
stdio_cwd: null
timeout: 30
http_headers: {  }
tools:
  -
    name: find_albums
    description: "Finds the site's albums by the words in their name or description, including the year. Every match is returned, newest first."
    inputSchema:
      type: object
      properties:
        query:
          oneOf:
            -
              type: string
            -
              type: 'null'
          minLength: 2
          description: 'Query: Words to look for. Every word has to appear somewhere in the album''s folder name, title or description, but they do not have to be next to each other. Matched case insensitively, each word from its start. The year is part of the folder name, so "2019" finds that year''s albums. A query needs at least two characters. Without a query, every album is listed.'
          title: Query
      additionalProperties: false
    enabled: true
    locked: false
    operation: read
    outputSchema:
      type: object
      properties:
        total:
          type: integer
          description: 'Total: How many albums matched.'
          title: Total
        results:
          type: array
          description: 'Results: The matching albums.'
          items:
            type: object
            properties:
              id:
                type: string
                minLength: 1
                description: 'Id: Also the prefix of every image id in the album.'
                title: Id
              title:
                type: string
                minLength: 1
                description: "Title: The album's display name."
                title: Title
              url:
                type: string
                format: uri
                description: "Url: Absolute URL to the album's page."
                title: Url
              year:
                oneOf:
                  -
                    type: integer
                  -
                    type: 'null'
                description: 'Year: The year the album is from.'
                title: Year
              description:
                type: string
                contentMediaType: text/html
                description: 'Description: Shown inside a paragraph at the top of the album page, so it may hold inline HTML such as a link.'
                title: Description
            required:
              - id
              - title
              - url
          title: Results
      required:
        - total
        - results
    lockedDefinition: null
  -
    name: find_images
    description: "Finds the site's images by the words written about them, by album, or both. A search returns at most 20 images. Listing an album without a query returns all of its images. There is no pagination: when total is higher than the number returned, narrow the query. Results come newest first, except that a search lists images whose title has every word of the query before the rest. Only the month of each image is included, so use this order to tell which came first. Each image's posts field lists the published posts that embed it, link to it, or show it as their lead image. To see how a post uses an image, append .md to the post's URL."
    inputSchema:
      type: object
      properties:
        query:
          oneOf:
            -
              type: string
            -
              type: 'null'
          minLength: 2
          description: 'Query: Words to look for. Every word has to appear somewhere in the title, caption or alt text, but they do not have to be next to each other. Matched case insensitively, each word from its start, so "engine" also matches "engineer". A query needs at least two characters. Without a query, the newest images are listed, or every image in the album when one is given.'
          title: Query
        album:
          oneOf:
            -
              type: string
            -
              type: 'null'
          description: 'Album: The album to look in: an id from find_albums, or the album field of an image. Without an album, every album is searched.'
          title: Album
      additionalProperties: false
    enabled: true
    locked: false
    operation: read
    outputSchema:
      type: object
      properties:
        total:
          type: integer
          description: 'Total: How many images matched, including any not returned.'
          title: Total
        results:
          type: array
          description: 'Results: The matching images.'
          items:
            type: object
            properties:
              id:
                type: string
                minLength: 1
                description: "Id: The album's id, a slash, then the image's name."
                title: Id
              title:
                type: string
                minLength: 1
                description: "Title: The image's display name."
                title: Title
              url:
                type: string
                format: uri
                description: "Url: Absolute URL to the image's page on dri.es."
                title: Url
              album:
                type: string
                description: 'Album: The id of the album the image is in, as find_albums returns it.'
                title: Album
              thumbnail:
                type: string
                format: uri
                description: 'Thumbnail: Absolute URL to a copy at most 640px wide, for showing the image.'
                title: Thumbnail
              alt:
                type: string
                contentMediaType: text/plain
                description: 'Alt: Plain text describing the image for screen readers.'
                title: Alt
              caption:
                type: string
                contentMediaType: text/html
                description: 'Caption: Sanitized HTML shown under the image.'
                title: Caption
              credit:
                type: string
                contentMediaType: text/plain
                description: 'Credit: Who to credit for the image. Omitted for images by Dries.'
                title: Credit
              month:
                type: string
                description: 'Month: The year and month the image was taken, as YYYY-MM. Omitted when the image has no date.'
                title: Month
              posts:
                type:
                  - array
                  - 'null'
                description: 'Posts: Absolute URLs of the posts that use this image. Omitted when there are none.'
                items:
                  type: string
                title: Posts
            required:
              - id
              - title
              - url
              - album
              - alt
          title: Results
      required:
        - total
        - results
    lockedDefinition: null
  -
    name: search
    description: "Full-text search across the site's content, ranked by relevance. Returns up to 20 items, ordered by relevance. The `total` field gives the number of items that matched. There is no pagination, so consider narrowing the query when `total` exceeds 20. Append `.md` to a result URL for that item's full text as Markdown."
    inputSchema:
      type: object
      properties:
        q:
          type: string
          description: 'Q: Search query. Every term must match, each as a prefix, so "waffle" also matches "waffles" and adding a term narrows the search. Punctuation is stripped, so quoting a phrase does not hold its words together. A query shorter than two characters returns no results rather than an error.'
          title: Q
      required:
        - q
      additionalProperties: false
    enabled: true
    locked: false
    operation: read
    outputSchema:
      type: object
      required:
        - total
        - results
      properties:
        total:
          type: integer
          description: 'Total: Number of items matching the query, which can exceed the number returned.'
          title: Total
        results:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
                description: "Title: The item's name, as shown at the top of its page."
                title: Title
              url:
                type: string
                format: uri
                description: 'Url: Absolute URL of the canonical version of the content.'
                title: Url
              date:
                type: string
                format: date
                description: 'Date: Publication date in ISO 8601 format (YYYY-MM-DD).'
                title: Date
              snippets:
                type: array
                items:
                  type: string
                description: "Snippets: Complete paragraphs from the item's body containing any of the query words, at most three, in document order but not always adjacent. Plain text: Markdown and HTML are removed. Empty when no paragraph holds the words, as when they appear only in the title or a heading."
                title: Snippets
              summary:
                type: string
                description: 'Summary: Short author-written summary, present only when the author wrote one.'
                title: Summary
            required:
              - title
              - url
              - date
              - snippets
          title: Results
    lockedDefinition: null
